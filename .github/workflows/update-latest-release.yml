name: Update latest release metadata

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-latest-release-main
  cancel-in-progress: false

jobs:
  update-latest-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update latest release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG_NAME: ${{ github.event.release.tag_name }}
          EVENT_HTML_URL: ${{ github.event.release.html_url }}
          EVENT_RELEASE_NAME: ${{ github.event.release.name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            gh api repos/${{ github.repository }}/releases/latest > /tmp/latest-release.json
            python - <<'PY'
          import json
          with open("/tmp/latest-release.json", encoding="utf-8") as f:
              release = json.load(f)
          data = {
              "tag_name": release["tag_name"],
              "html_url": release["html_url"],
              "name": release.get("name") or release["tag_name"]
          }
          with open("latest-release.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          else
            python - <<'PY'
          import json, os
          data = {
              "tag_name": os.environ["EVENT_TAG_NAME"],
              "html_url": os.environ["EVENT_HTML_URL"],
              "name": os.environ.get("EVENT_RELEASE_NAME") or os.environ["EVENT_TAG_NAME"]
          }
          with open("latest-release.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-release.json
          git commit -m "Update latest release metadata" || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
