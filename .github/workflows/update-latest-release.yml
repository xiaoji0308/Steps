name: Update latest release metadata

on:
  release:
    types: [published, released]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-latest-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update latest release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG_NAME: ${{ github.event.release.tag_name }}
          EVENT_HTML_URL: ${{ github.event.release.html_url }}
          EVENT_RELEASE_NAME: ${{ github.event.release.name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: use the latest-release.json values only if no release event is available."
            exit 0
          fi
          python - <<'PY'
          import json, os
          data = {
              "tag_name": os.environ["EVENT_TAG_NAME"],
              "html_url": os.environ["EVENT_HTML_URL"],
              "name": os.environ.get("EVENT_RELEASE_NAME") or os.environ["EVENT_TAG_NAME"]
          }
          with open("latest-release.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-release.json
          git commit -m "Update latest release metadata: $EVENT_TAG_NAME" || exit 0
          git push origin HEAD:main
