name: Update latest release metadata

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-latest-release-main
  cancel-in-progress: false

jobs:
  update-latest-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update latest release metadata and ksu-update.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq '.tag_name')
          fi

          python3 - <<'PY'
          import json, os
          tag = os.environ["TAG"]
          data = {
              "tag_name": tag,
              "html_url": "https://github.com/%s/releases/tag/%s" % (os.environ["GITHUB_REPOSITORY"], tag),
              "name": tag
          }
          with open("latest-release.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

          mkdir -p /tmp/dl
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.zip' -D /tmp/dl --clobber
          ZIP=$(basename "$(ls /tmp/dl/*.zip | head -1)")
          VER=$(unzip -p "/tmp/dl/$ZIP" module.prop | sed -n 's/^version=//p')
          VC=$(unzip -p "/tmp/dl/$ZIP" module.prop | sed -n 's/^versionCode=//p')
          cat > ksu-update.json <<EOF
          {
            "version": "$VER",
            "versionCode": $VC,
            "zipUrl": "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ZIP"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-release.json ksu-update.json
          git commit -m "chore: sync update metadata for $TAG" || exit 0
          git push
