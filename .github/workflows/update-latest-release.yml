      - name: Update latest release metadata and ksu-update.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # latest-release.json（WebUI 检查更新用，保持原逻辑）
          python - <<'PY'
          import json, os
          data = {
              "tag_name": os.environ["TAG"],
              "html_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{os.environ['TAG']}",
              "name": os.environ["TAG"]
          }
          with open("latest-release.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          # ksu-update.json（KSU 管理器本地列表检查更新用）
          mkdir -p /tmp/dl
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.zip' -D /tmp/dl --clobber
          ZIP=$(basename "$(ls /tmp/dl/*.zip | head -1)")
          VER=$(unzip -p "/tmp/dl/$ZIP" module.prop | sed -n 's/^version=//p')
          VC=$(unzip -p "/tmp/dl/$ZIP" module.prop | sed -n 's/^versionCode=//p')
          cat > ksu-update.json <<EOF
          {
            "version": "$VER",
            "versionCode": $VC,
            "zipUrl": "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ZIP"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-release.json ksu-update.json
          git commit -m "chore: sync update metadata for $TAG" || exit 0
          git push
